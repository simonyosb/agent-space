name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag and versions
        run: node scripts/check-release.mjs --tag "$RELEASE_TAG"

      - name: Validate release secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing release secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/agentspace-certificate.p12"
          keychain_path="$RUNNER_TEMP/agentspace-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 5400 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The certificate does not contain a Developer ID Application identity."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "AGENTSPACE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          rm -f "$certificate_path"

      - name: Build, sign, notarize, and upload release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: AgentSpace ${{ env.RELEASE_TAG }}
          releaseBody: macOS Apple Silicon build for AgentSpace.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          tauriScript: bun tauri
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg_path="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/AgentSpace_${version}_aarch64.dmg"
          result_path="$RUNNER_TEMP/dmg-notarization.json"
          log_path="$RUNNER_TEMP/dmg-notarization.log"

          set +e
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "$result_path"
          submit_exit=$?
          set -e

          status="$(jq -r '.status // empty' "$result_path" 2>/dev/null || true)"
          submission_id="$(jq -r '.id // empty' "$result_path" 2>/dev/null || true)"
          if (( submit_exit != 0 )) || [[ "$status" != "Accepted" ]]; then
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" > "$log_path" || true
              cat "$log_path"
            fi
            echo "::error::DMG notarization finished with status: ${status:-unknown}"
            exit 1
          fi

          xcrun stapler staple "$dmg_path"

      - name: Replace draft DMG with notarized artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg_path="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/AgentSpace_${version}_aarch64.dmg"
          gh release upload "$RELEASE_TAG" "$dmg_path" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify signed and notarized artifacts
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bundle_root="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_path="$bundle_root/macos/AgentSpace.app"
          dmg_path="$bundle_root/dmg/AgentSpace_${version}_aarch64.dmg"
          updater_path="$bundle_root/macos/AgentSpace.app.tar.gz"

          test -d "$app_path"
          test -s "$dmg_path"
          test -s "$updater_path"
          test -s "$updater_path.sig"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$app_path/Contents/MacOS/fleet-msg"
          codesign --verify --strict --verbose=2 "$app_path/Contents/MacOS/fleet-mcp"
          codesign -dvv "$app_path" 2>&1 | awk '/^Authority=Developer ID Application/ { found=1 } END { exit found ? 0 : 1 }'
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgentSpace-${{ env.RELEASE_TAG }}-macOS-aarch64
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

      - name: Verify published updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          set -euo pipefail
          manifest_path="$RUNNER_TEMP/latest.json"
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.assets[] | select(.name == "latest.json") | .id')"
          if [[ -z "$asset_id" ]]; then
            echo "::error::The draft release does not contain latest.json."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -H "Accept: application/octet-stream" > "$manifest_path"
          signature_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/AgentSpace.app.tar.gz.sig"
          node scripts/verify-updater-manifest.mjs "$manifest_path" "${RELEASE_TAG#v}" "$signature_path"

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${AGENTSPACE_KEYCHAIN_PATH:-}" && -f "$AGENTSPACE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$AGENTSPACE_KEYCHAIN_PATH"
          fi
